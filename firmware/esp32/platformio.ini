; Fairy drone companion computer: Seeed XIAO ESP32-S3
;   pio run -t upload        build and flash over USB-C
;   pio device monitor       telemetry at 115200 baud
[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags =
    -I ../core
    -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> +<../../core/*.c>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
